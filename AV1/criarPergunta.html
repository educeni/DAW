<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Pergunta</title>
</head>
<body>
    <form action="criarPergunta.php" method="POST">
        <label for="idPergunta">Forneca o codigo da pergunta</label>
        <input type="number" id="idPergunta" name="idPergunta">
        <br><br>
        <label for="pergunta">Forneca a pergunta</label>
        <input type="text" id="pergunta" name="pergunta">
        <br><br>
        <label for="alt">Alternativa 1</label>
        <input type="text" id="alt" name="alt">
        <br><br>
        <label for="alt2">Alternativa 2</label>
        <input type="text" id="alt2" name="alt2">
        <br><br>
        <label for="alt3">Alternativa 3</label>
        <input type="text" id="alt3" name="alt3">
        <br><br>
        <label for="alt4">Alternativa 4</label>
        <input type="text" id="alt4" name="alt4">
        <br><br>
        <label for="certa">Qual a alternativa certa</label>
        <input type="number" id="certa" name="certa">
        <br><br>
        <input type="submit" value="Confirmar">
    </form>
</body>
</html>
